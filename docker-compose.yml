version: '3.8'

services:

  backend:
    build:
      # `context: .` - контекст сборки. Это путь к папке, которую Docker "увидит" при сборке.
      # `.` означает "текущая папка" (где лежит docker-compose.yml).
      # Docker сможет получить доступ ко всем файлам внутри этой папки.
      context: .
      # `dockerfile: Dockerfile.backend` - явно указываем, какой Dockerfile использовать для сборки.
      # Это полезно, когда у вас несколько Dockerfile в проекте.
      dockerfile: Dockerfile.backend
      
    # `container_name: math_app_backend` - даем нашему контейнеру понятное имя.
    # Если не указать, Docker сгенерирует случайное имя.
    container_name: math_app_backend

    # `ports` - "проброс портов". Связывает порт на вашей машине с портом внутри контейнера.
    ports:
      # Формат "ХОСТ:КОНТЕЙНЕР"
      # `- "8000:8000"` означает: "Все запросы, которые приходят на порт 8000 моей машины (хоста),
      # перенаправляй на порт 8000 внутри этого контейнера".
      # Именно поэтому вы можете открыть `localhost:8000` в браузере и увидеть результат.
      - "8000:8000"

    # `volumes` - "проброс папок" или "монтирование томов".
    # Это одна из самых важных секций для разработки. Она синхронизирует папку на вашей
    # машине с папкой внутри уже запущенного контейнера.
    volumes:
      # `- ./app:/app/app` означает: "Папку `./app` на моей машине сделай зеркалом
      # папки `/app/app` внутри контейнера".
      # Любое изменение, которое вы сделаете в коде в VS Code, мгновенно появится
      # внутри контейнера. Благодаря этому `uvicorn --reload` увидит изменения и перезагрузит сервер.
      # Без этого вам пришлось бы пересобирать весь контейнер после каждого изменения.
      - ./app:/app/app 
      - ./content:/app/content # Аналогично для папки с контентом

      # `- ./tasks.db:/app/tasks.db` - очень важный том.
      # Файл базы данных SQLite будет храниться не внутри контейнера (где он бы удалился
      # при перезапуске), а на вашей основной машине. Это обеспечивает сохранность данных.
      - ./tasks.db:/app/tasks.db

  # --- Описание второго сервиса: ФРОНТЕНД ---
  frontend:
    build:
      # Аналогично бэкенду, собираем образ по своей инструкции.
      context: .
      dockerfile: Dockerfile.frontend
      
    container_name: math_app_frontend

    ports:
      # Пробрасываем порт 80 из контейнера Nginx (стандартный HTTP порт)
      # на порт 5173 вашей машины (стандартный порт Vite).
      - "5173:80"

    # `depends_on` - определяет порядок запуска сервисов.
    depends_on:
      # Эта строка говорит: "Не запускай контейнер `frontend`, пока контейнер `backend`
      # не будет запущен и готов к работе".
      # Это полезно, чтобы фронтенд не стартовал раньше, чем API, к которому он будет обращаться.
      - backend